<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000a14">
<title>보이ㄷㅏ — Let There Be Light</title>
<link rel="preload" href="assets/world.webp" as="image" fetchpriority="high">
<link rel="preload" href="fonts/gowun-batang-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/gowun-batang-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/codex.css">
</head>
<body>
  <div id="stage">

    <!-- 세계: 오프닝의 빛에 의해 점진적으로 드러난다 -->
    <div id="world-layer">
      <div id="world-art">
        <img id="world-img" src="assets/world.webp" alt="" decoding="async" fetchpriority="high">
      </div>
      <div id="wet"></div>
      <div id="sky-fx"></div>
      <div id="nodes"></div>
    </div>

    <!-- 어둠. 오프닝 동안 빛이 이것을 걷어낸다 -->
    <div id="veil"></div>
    <div id="glow"></div>

    <!-- 오프닝 문장들 -->
    <section id="opening">
      <div class="verse">
        <p id="line-fiat" class="opening-line">빛이 있으라.</p>
        <p id="line-after" class="opening-line">그러자 빛이 있었다.</p>
      </div>
      <p id="line-law" class="opening-line law" role="button" tabindex="0">빛은 입자이면서 파동이다.</p>
    </section>

    <!-- 문제 -->
    <section id="quiz" class="sheet" aria-hidden="true"></section>

    <!-- 지식 -->
    <section id="article" class="sheet" aria-hidden="true"></section>

    <!-- 도감 -->
    <section id="codex" class="sheet" aria-hidden="true"></section>

    <!-- 하단 이동 -->
    <nav id="nav" aria-hidden="true">
      <button class="nav-item is-active" data-view="world">
        <svg viewBox="0 0 32 22" aria-hidden="true"><path d="M1 21 L11 4 L17.5 14.5 L21 9 L31 21 Z"/><path class="snow" d="M21 9 L24.2 14.4 L22.4 13.6 L20.6 14.9 L18.8 13.9 L17.5 14.5 Z"/></svg>
        <span>세계</span>
      </button>
      <button class="nav-item" data-view="codex">
        <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M16 5.2C13.2 3 9.6 2.4 5 3.2 A1 1 0 0 0 4 4.2 V19 a1 1 0 0 0 1.2 1c4.2-.7 7.6-.2 10.8 1.8 3.2-2 6.6-2.5 10.8-1.8A1 1 0 0 0 28 19V4.2a1 1 0 0 0-1-1c-4.6-.8-8.2-.2-11 2z" fill="none"/><path d="M16 5.2V22" fill="none"/></svg>
        <span>백과사전</span>
      </button>
    </nav>

  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
